name: RetailiX Daily Smartphone Automation

on:
  schedule:
    # 12:00 AM IST = 18:30 UTC
    - cron: "30 18 * * *"

  workflow_dispatch:
    inputs:
      test_date:
        description: "Optional test date (YYYY-MM-DD). Leave blank for normal previous-24h mode."
        required: false
        default: ""
        type: string

# Prevent two runs from modifying the same Excel file at the same time.
concurrency:
  group: retailix-smartphone-automation
  cancel-in-progress: false

permissions:
  contents: write

env:
  RETAILIX_TEST_DATE: ${{ inputs.test_date }}

jobs:
  run-automation:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 openpyxl

      -- name: Run RetailiX automation
  run: |
    echo "===== MAIN.PY CHECK ====="
    pwd
    echo "Line count:"
    wc -l main.py
    echo "File size:"
    wc -c main.py
    echo "First 5 lines:"
    head -5 main.py
    echo "Last 5 lines:"
    tail -5 main.py
    echo "===== PYTHON CHECK ====="
    python -m py_compile main.py
    echo "===== RUNNING AUTOMATION ====="
    python -u main.py

      - name: Save updated Excel file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "product_import_template (1).xlsx"

          if git diff --cached --quiet; then
            echo "No Excel changes to commit."
          else
            git commit -m "Daily smartphone import update"
            git push
          fi
