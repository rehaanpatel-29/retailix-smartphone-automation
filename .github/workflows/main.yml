name: RetailiX Daily Smartphone Automation

on:
  schedule:
    # 12:00 AM IST = 18:30 UTC
    - cron: "30 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-automation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl requests beautifulsoup4 playwright feedparser

      - name: Install Playwright Chromium
        run: |
          python -m playwright install --with-deps chromium

      - name: Run RetailiX automation
        run: |
          python main.py

      - name: Save updated Excel file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "product_import_template (1).xlsx"

          if git diff --cached --quiet; then
            echo "No Excel changes to commit."
          else
            git commit -m "Daily smartphone import update"
            git push
          fi
