name: RetailiX Daily Smartphone Automation

on:
  schedule:
    - cron: "30 18 * * *" # 12:00 AM IST
  workflow_dispatch:
    inputs:
      scan_mode:
        description: "Choose the discovery window"
        required: true
        type: choice
        options:
          - seven_days
          - single_date
        default: seven_days
      scan_date:
        description: "Required only for single_date mode (YYYY-MM-DD, India date)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: retailix-daily-smartphone-automation
  cancel-in-progress: false

jobs:
  run-automation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RETAILIX_SCAN_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.scan_mode || 'seven_days' }}
      RETAILIX_SCAN_DATE: ${{ github.event_name == 'workflow_dispatch' && inputs.scan_date || '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: |
          pip install openpyxl requests beautifulsoup4 playwright feedparser
          python -m playwright install chromium

      - name: Run smartphone automation
        run: python main.py

      - name: Save updated Excel file
        run: |
          if [[ -n "$(git status --porcelain -- 'product_import_template (1).xlsx')" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- 'product_import_template (1).xlsx'
            git commit -m "Update smartphone catalogue"
            git push
          else
            echo "No Excel changes to commit."
          fi
