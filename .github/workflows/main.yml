
name: RetailiX Daily Smartphone Automation

on:
  schedule:
    - cron: "30 18 * * *" # Midnight IST (00:00)

  workflow_dispatch:
    inputs:
      scan_mode:
        description: "Choose the discovery window"
        required: true
        type: choice
        options:
          - seven_days
          - single_date
        default: seven_days

      scan_date:
        description: "India launch date (YYYY-MM-DD), required for single_date"
        required: false
        type: string

      allow_historical_test:
        description: "Allow dates older than 7 days for historical testing"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: retailix-daily-smartphone-automation
  cancel-in-progress: false

jobs:
  run-automation:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      RETAILIX_SCAN_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.scan_mode || 'seven_days' }}
      RETAILIX_SCAN_DATE: ${{ github.event_name == 'workflow_dispatch' && inputs.scan_date || '' }}
      RETAILIX_ALLOW_HISTORICAL_TEST: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_historical_test && '1' || '0' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl requests beautifulsoup4 playwright feedparser
          python -m playwright install chromium

      - name: Run smartphone automation
        run: python main.py

      - name: Save updated Excel file
        run: |
          if [[ -f "product_import_template (1).xlsx" ]]; then
            if [[ -n "$(git status --porcelain -- 'product_import_template (1).xlsx')" ]]; then
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add -- "product_import_template (1).xlsx"
              git commit -m "Update smartphone catalogue"
              git push
            else
              echo "No Excel changes to commit."
            fi
          else
            echo "ERROR: Master Excel file not found."
            exit 1
          fi
